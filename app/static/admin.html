<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI Admin</title>
<style>
  :root {
    --bg: #171b21;      /* page */
    --raised: #1e242c;  /* boxes and buttons sit one step lighter */
    --rule: #2b333d;    /* borders and lines */
    --text: #eef2f6;
    --muted: #7d8b99;
    --accent: #4a9fd8;
    --good: #3f9e6b;
    --warn: #d9912f;
    --over: #cc4b41;
  }


  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    padding: 20px 32px 48px;
  }

  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }

  .header-left  { justify-self: start; display: flex; align-items: center; gap: 10px; }
  .header-right { justify-self: end;   display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  /* justify-self places an item inside its own grid cell: start = left
     edge, end = right edge. flex-direction: column stacks the toggle above
     Sign out, as in the sketch. */

  .title { text-align: center; }
  .title h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.01em; }
  .title .subtitle {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;   /* spaced-out capitals read as a label */
    color: var(--muted);
    margin-top: 4px;
  }

  .muted { color: var(--muted); }

  select, button {
    font: inherit;            /* form controls don't inherit fonts by default */
    color: var(--text);
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 7px 12px;
    cursor: pointer;
  }
  select:hover, button:hover { border-color: var(--muted); }

  .lang {
    display: inline-flex;
    border: 1px solid var(--rule);
    border-radius: 4px;
    overflow: hidden;         /* clips the inner buttons to the rounded corners */
  }
  .lang button {
    border: none;
    border-radius: 0;
    padding: 5px 11px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
  }
  .lang button.active { background: var(--accent); color: #fff; }

  .section-title {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 30px 0 14px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .section-title::before,
  .section-title::after {
    content: "";              /* a pseudo-element doesn't render without content */
    width: 28px;
    height: 1px;
    background: var(--muted);
  }

  /* The bordered box around each table. */
  .panel {
    background: var(--raised);
    border: 1px solid var(--rule);
    border-radius: 8px;
    overflow-x: auto;         /* the table scrolls sideways INSIDE the box on narrow screens */
  }

  .panel.scrolling {
    max-height: 70vh;
    overflow-y: auto;
  }

  .panel.scrolling thead th {
    position: sticky;
    top: 0;
    z-index: 1;               /* draws the header above the rows sliding under it */
    background: var(--raised);
    border-bottom: none;
    box-shadow: inset 0 -1px 0 var(--rule);
  }

  /* ── Filters bar ───────────────────────────────────────────────────
     flex-wrap: wrap lets the controls drop to a second line on a narrow
     screen instead of overflowing. */
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .filters select { padding: 6px 10px; font-size: 13px; }
  .check {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
    user-select: none;        /* double-clicking the label won't highlight its text */
  }
  /* accent-color tints the native checkbox to match the theme, with no
     custom checkbox drawing needed. */
  .check input { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  /* margin-left: auto pushes the count to the far right of the flex row:
     the auto margin takes up all the leftover space. */
  .count { margin-left: auto; font-size: 13px; font-variant-numeric: tabular-nums; }

  /* The dashed line between the two sections. */
  .divider {
    border: none;
    border-top: 1px dashed var(--rule);
    margin: 34px 0 0;
  }

  /* ── Tables ────────────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; }
  /* border-collapse merges neighbouring cell borders into one line instead
     of drawing two next to each other. */

  th {
    text-align: left;
    font-weight: 500;
    color: var(--muted);
    font-size: 12px;
    padding: 11px 14px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  td {
    padding: 10px 14px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  /* The last row has no line under it, so the box's own border closes it.
     Otherwise you'd see a double line at the bottom. */
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: rgba(255, 255, 255, 0.02); }

  /* tabular-nums gives every digit the same width, so a column of
     durations lines up. Reading down that column is the point of the table. */
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.desc { white-space: normal; min-width: 220px; }
  td.strong { font-weight: 600; }

  /* Above 10% AUTOCLOSED or INCOMPLETE, that station's durations
     aren't trustworthy yet. */
  .bad { color: var(--over); font-weight: 600; }

  .chip {
    display: inline-block;
    font-size: 11px;
    padding: 2px 7px;
    margin-right: 4px;
    border-radius: 3px;
    background: var(--rule);
  }

  .status { font-size: 12px; font-weight: 600; }
  .status.CLOSED     { color: var(--good); }
  .status.OPEN       { color: var(--accent); }
  .status.AUTOCLOSED { color: var(--warn); }
  .status.INCOMPLETE { color: var(--over); }
  .status.CORRECTED  { color: var(--muted); }
  .flag { color: var(--warn); }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 28px 0;
    font-style: italic;
  }

  /* Phone width: stack the header into one column so nothing gets squeezed. */
  @media (max-width: 720px) {
    body { padding: 16px; }
    header { grid-template-columns: 1fr; justify-items: center; }
    .header-left, .header-right { justify-self: center; align-items: center; }
  }
</style>
</head>
<body>

<header>
  <!-- LEFT: period -->
  <div class="header-left">
    <!-- data-i18n="key" marks text that gets swapped when the language
         changes. The value is a key into the TEXT dictionary in the script. -->
    <label for="days" class="muted" data-i18n="show">Show</label>
    <select id="days">
      <option value="1" data-i18n="last1">Last 24 hours</option>
      <option value="7" data-i18n="last7" selected>Last 7 days</option>
      <option value="30" data-i18n="last30">Last 30 days</option>
      <option value="90" data-i18n="last90">Last 90 days</option>
    </select>
  </div>

  <!-- CENTRE: title -->
  <div class="title">
    <h1 data-i18n="title">Key Performance Indicator</h1>
    <div class="subtitle" data-i18n="subtitle">ADMIN VIEW</div>
  </div>

  <!-- RIGHT: language and sign out -->
  <div class="header-right">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
    </div>
    <!-- Sign out stays a POST form, not a link. A GET logout could be
         triggered by any page that embeds an image pointing at it. -->
    <form method="post" action="/admin/logout">
      <button type="submit" data-i18n="signOut">Sign out</button>
    </form>
  </div>
</header>

<h2 class="section-title" data-i18n="perStation">PER STATION</h2>
<div class="panel">
  <table>
    <thead>
      <tr>
        <th data-i18n="station">Station</th>
        <th class="num" data-i18n="sessions">Sessions</th>

        <th class="num" data-i18n="counted" data-i18n-title="countedHint">Counted Sessions</th>
        <th class="num" data-i18n="mean">Mean</th>
        <th class="num" data-i18n="median">Median</th>
        <th class="num" data-i18n="flagged">Flagged</th>
        <th class="num" data-i18n="autoclosed">Autoclosed</th>
        <th class="num" data-i18n="incomplete">Incomplete</th>
        <th class="num" data-i18n="openNow">Open now</th>
      </tr>
    </thead>
    <tbody id="stations"></tbody>
  </table>
</div>

<hr class="divider">

<h2 class="section-title" data-i18n="sessionsTitle">SESSIONS</h2>

<div class="filters">
  <select id="f-station" aria-label="Station"></select>
  <select id="f-employee" aria-label="Employee"></select>
  <!-- Wrapping the checkbox in its <label> makes the text clickable too. -->
  <label class="check">
    <input type="checkbox" id="f-flagged">
    <span data-i18n="flaggedOnly">Flagged only</span>
  </label>
  <span id="count" class="muted count"></span>
</div>

<div class="panel scrolling">
  <table>
    <thead>
      <tr>
        <th data-i18n="started">Started</th>
        <th data-i18n="station">Station</th>
        <th data-i18n="employee">Employee</th>
        <th data-i18n="order">Order</th>
        <th data-i18n="description">Description</th>
        <th data-i18n="features">Features</th>
        <th class="num" data-i18n="duration">Duration</th>
        <th data-i18n="status">Status</th>
      </tr>
    </thead>
    <tbody id="sessions"></tbody>
  </table>
</div>

<script>
const TEXT = {
  en: {
    show: 'Show',
    last1: 'Last 24 hours', last7: 'Last 7 days', last30: 'Last 30 days', last90: 'Last 90 days',
    title: 'Key Performance Indicator',
    subtitle: 'ADMIN VIEW',
    signOut: 'Sign out',
    perStation: 'PER STATION',
    sessionsTitle: 'SESSIONS',
    station: 'Station', sessions: 'Sessions', counted: 'Counted Sessions',
    countedHint: 'Closed with a FINISH scan and not flagged. Mean and median use these only.',
    mean: 'Mean', median: 'Median', flagged: 'Flagged', autoclosed: 'Autoclosed',
    incomplete: 'Incomplete', openNow: 'Open now',
    started: 'Started', employee: 'Employee', order: 'Order', description: 'Description',
    features: 'Features', duration: 'Duration', status: 'Status',
    empty: 'No sessions in this period yet...',
    noMatch: 'No sessions match these filters.',
    allStations: 'All stations', allEmployees: 'All employees', flaggedOnly: 'Flagged only',
    // {shown} and {total} are placeholders that get filled in by
    // fillTemplate(). Word order differs between languages, so the numbers
    // go INSIDE the sentence and aren't glued on the end.
    showing: 'Showing {shown} of {total}',
    flaggedTag: 'flagged',
    // Statuses: the server sends the code (CLOSED) and we show a label for it.
    // The code itself never changes, so the CSS colour classes keep working
    // in either language.
    CLOSED: 'Closed', OPEN: 'Open', AUTOCLOSED: 'Autoclosed',
    INCOMPLETE: 'Incomplete', CORRECTED: 'Corrected',
    locale: 'en-CA',   // date formatting follows the language too
  },
  fr: {
    show: 'Afficher',
    last1: 'Dernières 24 heures', last7: '7 derniers jours', last30: '30 derniers jours', last90: '90 derniers jours',
    title: 'KPI',
    subtitle: 'VUE ADMINISTRATEUR',
    signOut: 'Déconnexion',
    perStation: 'PAR POSTE',
    sessionsTitle: 'SESSIONS',
    station: 'Poste', sessions: 'Sessions', counted: 'Sessions comptées',
    countedHint: 'Terminées par un scan FINISH et non signalées. La moyenne et la médiane utilisent seulement celles-ci.',
    mean: 'Moyenne', median: 'Médiane', flagged: 'Signalées', autoclosed: 'Fermées auto',
    incomplete: 'Incomplètes', openNow: 'En cours',
    started: 'Début', employee: 'Employé', order: 'Commande', description: 'Description',
    features: 'Caractéristiques', duration: 'Durée', status: 'Statut',
    empty: 'Aucune session pour cette période...',
    noMatch: 'Aucune session ne correspond à ces filtres.',
    allStations: 'Tous les postes', allEmployees: 'Tous les employés', flaggedOnly: 'Signalées seulement',
    showing: '{shown} sur {total} affichées',
    flaggedTag: 'signalée',
    CLOSED: 'Terminée', OPEN: 'En cours', AUTOCLOSED: 'Fermée auto',
    INCOMPLETE: 'Incomplète', CORRECTED: 'Corrigée',
    locale: 'fr-CA',
  },
};

function loadLang() {
  try {
    const saved = localStorage.getItem('kpi-admin-lang');
    if (saved === 'en' || saved === 'fr') return saved;   // only accept known values
  } catch (e) { /* storage unavailable: fall through to the default */ }
  return 'en';
}

function saveLang(lang) {
  try { localStorage.setItem('kpi-admin-lang', lang); } catch (e) { /* not critical */ }
}

let lang = loadLang();

function t(key) {
  return TEXT[lang][key] || key;
}

function applyLanguage() {
  for (const el of document.querySelectorAll('[data-i18n]')) {
    el.textContent = t(el.dataset.i18n);
  }
  // Tooltips (title attribute) are handled separately from visible text.
  for (const el of document.querySelectorAll('[data-i18n-title]')) {
    el.title = t(el.dataset.i18nTitle);
  }

  document.documentElement.lang = lang;   // <html lang="..."> helps screen readers and spell-check

  // Highlight the active button in the toggle.
  for (const btn of document.querySelectorAll('.lang button')) {
    btn.classList.toggle('active', btn.dataset.lang === lang);

  }

  if (lastData) render(lastData);
}

for (const btn of document.querySelectorAll('.lang button')) {
  btn.addEventListener('click', () => {
    lang = btn.dataset.lang;
    saveLang(lang);
    applyLanguage();
  });
}

// ═════════════════════════════════════════════════════════════════════
// Loading
// ═════════════════════════════════════════════════════════════════════
let lastData = null;   // kept so a language switch can re-render without refetching

async function load() {
  const days = document.getElementById('days').value;
  const response = await fetch('/api/admin/sessions?days=' + days);
  if (response.status === 401) {
    location.href = '/admin/login';
    return;
  }

  lastData = await response.json();
  render(lastData);
}

function render(data) {
  renderStations(data.stations);
  renderSessions(data.sessions);
}

document.getElementById('days').addEventListener('change', load);

function renderStations(stations) {
  const body = document.getElementById('stations');
  body.replaceChildren();   // clears the previous render's rows

  if (stations.length === 0) {
    body.append(emptyRow(9, t('empty')));
    return;
  }

  for (const s of stations) {
    body.append(row([
      cell(s.name, 'strong'),
      cell(s.sessions, 'num'),
      cell(s.clean, 'num'),               // API field is still "clean"; only the label changed
      cell(fmtDuration(s.mean_seconds), 'num'),
      cell(fmtDuration(s.median_seconds), 'num'),
      cell(s.flagged_pct + '%', 'num'),
      // Only the data-quality rates get highlighted. A high flag rate may be
      // genuine; a high autoclose rate means people aren't scanning FINISH.
      cell(s.autoclosed_pct + '%', 'num' + (s.autoclosed_pct > 10 ? ' bad' : '')),
      cell(s.incomplete_pct + '%', 'num' + (s.incomplete_pct > 10 ? ' bad' : '')),
      cell(s.open, 'num'),
    ]));
  }
}

const fStation  = document.getElementById('f-station');
const fEmployee = document.getElementById('f-employee');
const fFlagged  = document.getElementById('f-flagged');

for (const control of [fStation, fEmployee, fFlagged]) {
  control.addEventListener('change', () => {
    if (lastData) renderSessions(lastData.sessions);
  });
}

function fillSelect(select, values, allLabel) {
  const current = select.value;
  select.replaceChildren();

  select.append(new Option(allLabel, ''));
  for (const v of values) select.append(new Option(v, v));

  select.value = values.includes(current) ? current : '';
}

function uniqueValues(sessions, field) {
  return [...new Set(sessions.map(s => s[field]).filter(Boolean))].sort();
}

function fillTemplate(template, values) {
  return template.replace(/\{(\w+)\}/g, (match, key) => values[key]);
}

function renderSessions(all) {
  const body = document.getElementById('sessions');
  body.replaceChildren();

  fillSelect(fStation,  uniqueValues(all, 'station'),  t('allStations'));
  fillSelect(fEmployee, uniqueValues(all, 'employee'), t('allEmployees'));

  const sessions = all.filter(s =>
    (fStation.value  === '' || s.station  === fStation.value) &&
    (fEmployee.value === '' || s.employee === fEmployee.value) &&
    (!fFlagged.checked || s.is_flagged)
  );

  document.getElementById('count').textContent =
    fillTemplate(t('showing'), { shown: sessions.length, total: all.length });

  if (sessions.length === 0) {
    body.append(emptyRow(8, all.length === 0 ? t('empty') : t('noMatch')));
    return;
  }

  for (const s of sessions) {
    const features = document.createElement('td');
    for (const f of s.features) {
      const chip = document.createElement('span');
      chip.className = 'chip';
      chip.textContent = f;
      features.append(chip);
    }

    const status = cell(t(s.status));
    status.firstChild.className = 'status ' + s.status;
    if (s.is_flagged) {
      const flag = document.createElement('span');
      flag.className = 'flag';
      flag.textContent = ' · ' + t('flaggedTag');
      status.append(flag);
    }

    body.append(row([
      cell(fmtDateTime(s.started_at_utc)),
      cell(s.station),
      cell(s.employee),
      cell(s.order_ref),
      cell(s.description || '', 'desc'),
      features,
      cell(fmtDuration(s.duration_seconds), 'num'),
      status,
    ]));
  }
}

// Helpers
function cell(value, cls) {
  const td = document.createElement('td');
  if (cls) td.className = cls;
  const span = document.createElement('span');
  span.textContent = value ?? '—';
  td.append(span);
  return td;
}

function row(cells) {
  const tr = document.createElement('tr');
  tr.append(...cells);   // ... spreads the array into separate arguments
  return tr;
}

function emptyRow(colspan, text) {
  const tr = document.createElement('tr');
  const td = document.createElement('td');
  td.colSpan = colspan;  // one cell stretched across the whole table
  td.className = 'empty';
  td.textContent = text;
  tr.append(td);
  return tr;
}

function fmtDuration(seconds) {
  if (seconds === null || seconds === undefined) return '—';
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  const mm = String(m).padStart(2, '0');   // 5 -> "05"
  const ss = String(s).padStart(2, '0');
  return h > 0 ? h + ':' + mm + ':' + ss : m + ':' + ss;
}

function fmtDateTime(iso) {
  return new Date(iso).toLocaleString(t('locale'), {
    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

applyLanguage();   // labels first, so the page never flashes English before switching to French
load();
</script>
</body>
</html>
